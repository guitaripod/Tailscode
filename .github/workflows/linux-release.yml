name: Linux release

# A binary built on the author's Arch box runs on no Ubuntu release at all — it needs GLIBC_2.44,
# and 26.04 LTS ships 2.43. glibc is forward-compatible and never backward, so the artifact has to
# be built against the oldest glibc it must run on. Ubuntu 24.04 (glibc 2.39) covers 24.04, 25.10,
# 26.04, Debian 13, Mint, Pop!_OS and Arch in one file, and costs nothing: the code's real toolkit
# floor is GTK 4.12, which 24.04's 4.14 clears.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Attach the artifact to the release for this tag
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4

      - name: System libraries
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev libgdk-pixbuf-2.0-dev libepoxy-dev \
            libvte-2.91-gtk4-dev libmpv-dev libwebkitgtk-6.0-dev \
            desktop-file-utils appstream git curl xvfb xauth

      # Every optional pane is decided by probing for its headers at manifest time, so a missing
      # -dev package does not fail the build — it silently ships an app without the terminal, the
      # video slot or the browser. A release must never be the one that quietly lost a feature.
      - name: Every optional pane is present
        run: |
          for header in \
            /usr/include/vte-2.91-gtk4/vte/vte.h \
            /usr/include/mpv/render_gl.h \
            /usr/include/webkitgtk-6.0/webkit/webkit.h
          do
            test -f "$header" || { echo "missing $header — the build would drop a pane"; exit 1; }
          done

      - name: Packaging metadata is valid
        run: |
          desktop-file-validate packaging/linux/io.github.guitaripod.Tailscode.desktop
          appstreamcli validate --no-net packaging/linux/io.github.guitaripod.Tailscode.metainfo.xml

      - name: Build
        run: TAILSCODE_KIT_REMOTE=1 scripts/package-linux.sh tarball

      # The whole point of building here rather than on the author's machine.
      # A ceiling, not an equality: what matters is that nothing in the artifact needs a glibc
      # newer than 24.04's, and an artifact that happens to need an older one runs on strictly more
      # machines. Pinning the exact number made a release fail for getting better — the floor moves
      # on its own whenever the code stops reaching for the one symbol that was holding it up.
      - name: The glibc floor is no higher than Ubuntu 24.04's
        run: |
          floor=$(objdump -T TailscodeLinux/.build/release/tailscode |
            grep -oE 'GLIBC_[0-9.]+' | sort -uV | tail -1)
          echo "requires $floor"
          highest=$(printf '%s\nGLIBC_2.39\n' "$floor" | sort -uV | tail -1)
          test "$highest" = "GLIBC_2.39" || {
            echo "$floor is newer than GLIBC_2.39 — this artifact would not run on Ubuntu 24.04"
            exit 1; }

      # The tarball stages into build/linux-tarball, which is the tree that actually ships — the
      # binary is checked where a user will find it rather than in a staging path this job never
      # writes.
      - name: It starts
        run: |
          xvfb-run -a build/linux-tarball/usr/bin/tailscode --version ||
            build/linux-tarball/usr/bin/tailscode --version

      - uses: actions/upload-artifact@v4
        with:
          name: tailscode-linux-x86_64
          path: |
            build/*.tar.gz
            build/*.sha256

      # The Swift image has curl and nothing else, so the release is made and filled over the API
      # rather than with a CLI this container would have to install first. A tag pushed from a
      # working copy has no release object behind it, and uploading to one that does not exist
      # fails the job after the artifact is already built.
      - name: Release notes body
        id: notes
        run: |
          version=$(sed -n 's/.*static let current = "\([^"]*\)".*/\1/p' \
            TailscodeLinux/Sources/TailscodeLinux/TailscodeVersion.swift | head -1)
          python3 - "$version" > /tmp/notes.txt <<'PY'
          import json, sys
          notes = json.load(open("docs/release-notes.json"))
          entry = notes.get(sys.argv[1], {})
          body = entry.get("en-US") or next(iter(entry.values()), "")
          print(json.dumps(body))
          PY
          printf 'NOTES_BODY<<EOF\n%s\nEOF\n' "$(cat /tmp/notes.txt)" >> "$GITHUB_ENV"
          echo "release body read for $version"
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api=https://api.github.com/repos/$GITHUB_REPOSITORY
          auth="Authorization: Bearer $GH_TOKEN"
          id=$(curl -fsS -H "$auth" "$api/releases/tags/$GITHUB_REF_NAME" |
            grep -m1 -o '"id": *[0-9]*' | grep -o '[0-9]*' || true)
          if [ -z "$id" ]; then
            id=$(curl -fsS -X POST -H "$auth" -H 'content-type: application/json' \
              -d "{\"tag_name\":\"$GITHUB_REF_NAME\",\"name\":\"${GITHUB_REF_NAME#v}\",\"body\":$NOTES_BODY}" \
              "$api/releases" | grep -m1 -o '"id": *[0-9]*' | grep -o '[0-9]*')
            echo "created release $GITHUB_REF_NAME"
          fi
          for file in build/*.tar.gz build/*.sha256; do
            name=$(basename "$file")
            curl -fsS -X POST -H "$auth" -H 'Content-Type: application/octet-stream' \
              --data-binary @"$file" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$id/assets?name=$name" \
              >/dev/null
            echo "uploaded $name"
          done
