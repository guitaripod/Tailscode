id: io.github.guitaripod.Tailscode
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.swift6
command: tailscode

build-options:
  append-path: /usr/lib/sdk/swift6/bin
  prepend-ld-library-path: /usr/lib/sdk/swift6/lib
  env:
    # Never resolve the Kit from a sibling working copy that does not exist here, and never let a
    # build reach the network: every dependency is a declared source with a SwiftPM mirror.
    TAILSCODE_KIT_REMOTE: '1'
    # The terminal's engine is built from the tarballs declared below rather than fetched.
    TAILSCODE_GHOSTTY_SOURCES: /run/build/tailscode/ghostty-vt-sources

finish-args:
  # The whole product is HTTP to a machine on your own tailnet. Without this it does nothing at all.
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # The voice call hears the microphone and speaks through PulseAudio's socket, which PipeWire
  # answers too. Without it a call in the sandbox says its audio is unavailable.
  - --socket=pulseaudio
  # The global summon chord is asked for through the portal rather than grabbed, and notifications
  # about a turn that needs you go through the portal too.
  - --talk-name=org.freedesktop.portal.Desktop
  # Saving a picture the agent produced, and attaching one to a prompt.
  - --filesystem=xdg-download
  - --filesystem=xdg-documents
  # Tailscale is a system service with a root-owned socket; it cannot be sandboxed and is not
  # shipped here. Reading `tailscale status` on the host is the only way the first-run check can
  # tell "this machine is not on your tailnet" from "this app cannot see whether it is", and the
  # difference is the whole of setup for someone who has never done it.
  - --talk-name=org.freedesktop.Flatpak

modules:
  - name: tailscode
    buildsystem: simple
    build-options:
      # The Swift toolchain wants a writable home for its caches.
      env:
        HOME: /run/build/tailscode
    sources:
      - type: dir
        path: ../..
      - generated-sources.json
      - type: file
        url: https://release.files.ghostty.org/libghostty-vt/1.0.1/libghostty-vt-1.0.1.tar.gz
        sha256: 333dfce97641ef9b536bb9e08907ad86abaaada50e8f7417b70d9284adef37aa
        dest: ghostty-vt-sources
      - type: file
        url: https://release.files.ghostty.org/libghostty-vt/1.0.1/libghostty-vt-1.0.1-deps.tar.gz
        sha256: 91a4e10960a52bf5bf4b15aa2a2cddaff8a89d6cd903d3055bda4fd17de3356d
        dest: ghostty-vt-sources
      - type: file
        only-arches: [x86_64]
        url: https://ziglang.org/download/0.17.1/zig-x86_64-linux-0.17.1.tar.xz
        sha256: 3581863e3cbcfd0fce0efc682ce7e9e93da96668a977791d356a26d2a7e9b17a
        dest: ghostty-vt-sources
      - type: file
        only-arches: [aarch64]
        url: https://ziglang.org/download/0.17.1/zig-aarch64-linux-0.17.1.tar.xz
        sha256: a1546d5646eb184437918d6635ca6b762a0e889eac09cef720ee7a1ed3fe7795
        dest: ghostty-vt-sources
    build-commands:
      - ./packaging/flatpak/set-mirrors.sh
      - PREFIX=/app scripts/package-linux.sh build
      - PREFIX=/app scripts/package-linux.sh install /
    post-install:
      # A Flatpak's own metainfo has to be the one the store reads, and the id it carries is the
      # Flatpak id rather than the binary's name.
      - install -Dm0644 packaging/linux/io.github.guitaripod.Tailscode.metainfo.xml
        /app/share/metainfo/io.github.guitaripod.Tailscode.metainfo.xml
