name: Tailscode
options:
  bundleIdPrefix: com.guitaripod
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  CodingAgentKit:
    path: ../../swift/CodingAgentKit
  TailscodeCore:
    path: TailscodeCore
  MidgarKit:
    url: https://github.com/guitaripod/MidgarKit
    from: "3.0.0"
targetTemplates:
  MacApp:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: TailscodeMac
        excludes:
          - Resources/AppIcon.icns
          - AGENTS.md
      - path: Tailscode/Usage/UsageWidgetStore.swift
      - path: Tailscode/Usage/UsageWidgetWriter.swift
      - path: Tailscode/Usage/UsagePushPayload.swift
      - path: Tailscode/Logging/AppLogger.swift
      - path: Tailscode/Logging/LogFileWriter.swift
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
      - path: Resources/InfoPlist.xcstrings
        buildPhase: resources
    dependencies:
      - package: CodingAgentKit
        product: CodingAgentKit
      - package: CodingAgentKit
        product: CodingAgentKitApple
      - package: TailscodeCore
        product: TailscodeCore
      - package: MidgarKit
        product: MidgarKit
    info:
      path: TailscodeMac/Info.plist
      properties:
        CFBundleDisplayName: Tailscode
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "GPL-3.0"
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.guitaripod.tailscode
            CFBundleURLSchemes: [tailscode, com.guitaripod.tailscode]
        LSApplicationQueriesSchemes:
          - com.guitaripod.embr
          - com.guitaripod.helia
          - com.guitaripod.payday
          - com.guitaripod.pixie
          - com.guitaripod.psybeam
          - com.guitaripod.tailscode
          - com.marcusziade.aotd
          - com.marcusziade.doublekick
          - com.marcusziade.dreameater
          - com.marcusziade.inventory
          - com.marcusziade.knowtheflag
          - com.marcusziade.psywave
          - com.marcusziade.sforesight
          - com.marcusziade.solarbeam
          - com.midgarcorp.flaccy
          - com.midgarcorp.flaccy.mac
          - midgar-01
          - midgar-02
          - midgar-03
          - midgar-04
          - midgar-05
          - midgar-06
          - midgar-07
          - midgar-08
          - midgar-09
          - midgar-10
          - midgar-11
          - midgar-12
          - midgar-13
          - midgar-14
          - midgar-15
          - midgar-16
          - midgar-17
          - midgar-18
          - midgar-19
          - midgar-20
          - midgar-21
          - midgar-22
          - midgar-23
          - midgar-24
          - midgar-25
          - midgar-26
          - midgar-27
          - midgar-28
          - midgar-29
          - midgar-30
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Tailscode connects to coding-agent servers you run on your own machines, including ones on your local network.
        NSMicrophoneUsageDescription: Talk to your coding agent out loud. Your voice goes over your tailnet to the server you chose, and nowhere else.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.guitaripod.tailscode
        MARKETING_VERSION: "1.78"
        CURRENT_PROJECT_VERSION: "195"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_DEBUG_DYLIB: NO
targets:
  Tailscode:
    type: application
    platform: iOS
    sources:
      - path: Tailscode
      - path: TailscodeNotificationUI/NoticeCardView.swift
      - path: TailscodeWidget/UsageWidget.swift
      - path: TailscodeWidget/UsageWidgetViews.swift
      - path: TailscodeWidget/UsageWidgetConfiguration.swift
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
      - path: Resources/InfoPlist.xcstrings
        buildPhase: resources
    dependencies:
      - package: CodingAgentKit
        product: CodingAgentKit
      - package: CodingAgentKit
        product: CodingAgentKitApple
      - package: CodingAgentKit
        product: AgentTestSupport
      - package: TailscodeCore
        product: TailscodeCore
      - package: MidgarKit
        product: MidgarKit
      - target: TailscodeWidget
        embed: true
      - target: TailscodeNSE
        embed: true
      - target: TailscodeNotificationUI
        embed: true
      - sdk: WidgetKit.framework
        weak: true
      - sdk: FoundationModels.framework
        weak: true
      - sdk: Metal.framework
      - sdk: MetalKit.framework
    info:
      path: Tailscode/Info.plist
      properties:
        CFBundleDisplayName: Tailscode
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        CADisableMinimumFrameDurationOnPhone: true
        NSSupportsLiveActivities: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleURLTypes:
          - CFBundleURLName: com.guitaripod.tailscode
            CFBundleURLSchemes: [tailscode, com.guitaripod.tailscode]
        LSApplicationQueriesSchemes:
          - com.guitaripod.embr
          - com.guitaripod.helia
          - com.guitaripod.payday
          - com.guitaripod.pixie
          - com.guitaripod.psybeam
          - com.guitaripod.tailscode
          - com.marcusziade.aotd
          - com.marcusziade.doublekick
          - com.marcusziade.dreameater
          - com.marcusziade.inventory
          - com.marcusziade.knowtheflag
          - com.marcusziade.psywave
          - com.marcusziade.sforesight
          - com.marcusziade.solarbeam
          - com.midgarcorp.flaccy
          - com.midgarcorp.flaccy.mac
        NSSupportsLiveActivitiesFrequentUpdates: true
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: com.guitaripod.tailscode.compose
            UIApplicationShortcutItemTitle: New Chat
            UIApplicationShortcutItemIconSymbolName: square.and.pencil
          - UIApplicationShortcutItemType: com.guitaripod.tailscode.saved
            UIApplicationShortcutItemTitle: Saved Chats
            UIApplicationShortcutItemIconSymbolName: bookmark
          - UIApplicationShortcutItemType: com.guitaripod.tailscode.usage
            UIApplicationShortcutItemTitle: Usage
            UIApplicationShortcutItemIconSymbolName: gauge.with.dots.needle.50percent
          - UIApplicationShortcutItemType: com.guitaripod.tailscode.ask
            UIApplicationShortcutItemTitle: Quick Ask
            UIApplicationShortcutItemIconSymbolName: sparkle
        NSUserActivityTypes:
          - com.guitaripod.tailscode.route
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Automatic
        NSPhotoLibraryUsageDescription: Attach images from your library to a prompt.
        NSCameraUsageDescription: Take a photo to ask your agent about it, or scan the code your computer prints to connect.
        NSMicrophoneUsageDescription: Talk to your agent out loud. Your voice goes to the server you chose over your tailnet, and nowhere else.
        NSPhotoLibraryAddUsageDescription: Save pictures from a conversation to your photo library.
        NSLocalNetworkUsageDescription: Tailscode connects to coding-agent servers you run on your own machines, including ones on your local network.
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIBackgroundModes: [fetch, remote-notification, audio]
        BGTaskSchedulerPermittedIdentifiers: [com.guitaripod.tailscode.usage-refresh]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.guitaripod.tailscode
        MARKETING_VERSION: "1.78"
        CURRENT_PROJECT_VERSION: "199"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: P4DQK6SRKR
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]: NO
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Tailscode/Tailscode-Debug.entitlements
          CODE_SIGN_IDENTITY[sdk=iphoneos*]: "Apple Development: Marcus Ziadé (AUJJ76QHS7)"
          PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]: Tailscode Dev iPhone Air 2026
        Release:
          CODE_SIGN_ENTITLEMENTS: Tailscode/Tailscode-Release.entitlements
          CODE_SIGN_IDENTITY[sdk=iphoneos*]: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]: Tailscode App Store 2026

  TailscodeWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: TailscodeWidget
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
      - path: Resources/Widget/InfoPlist.xcstrings
        buildPhase: resources
      - path: Tailscode/LiveActivity/ChatActivityAttributes.swift
      - path: Tailscode/Usage/UsageWidgetStore.swift
      - path: Tailscode/Usage/UsageControlIntents.swift
      - path: Tailscode/Home/QuickAskControlIntent.swift
      - path: Tailscode/Usage/UsageWidgetWriter.swift
      - path: Tailscode/Usage/UsagePushPayload.swift
      - path: Tailscode/Usage/LiveQuotaFetcher.swift
      - path: Tailscode/Usage/DeepSeekBalance.swift
      - path: Tailscode/Usage/OllamaUsage.swift
      - path: Tailscode/Connection/SharedConnectionStore.swift
      - path: Tailscode/Logging/AppLogger.swift
      - path: Tailscode/Logging/LogFileWriter.swift
    info:
      path: TailscodeWidget/Info.plist
      properties:
        CFBundleDisplayName: Tailscode
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Tailscode's widgets read live usage from coding-agent servers you run, including ones on your local network.
    dependencies:
      - package: CodingAgentKit
        product: CodingAgentKit
      - package: CodingAgentKit
        product: CodingAgentKitApple
      - package: TailscodeCore
        product: TailscodeCore
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework
      - sdk: ActivityKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.guitaripod.tailscode.widget
        MARKETING_VERSION: "1.78"
        CURRENT_PROJECT_VERSION: "199"
        SKIP_INSTALL: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: P4DQK6SRKR
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]: NO
        CODE_SIGN_ENTITLEMENTS: TailscodeWidget/TailscodeWidget.entitlements
      configs:
        Debug:
          CODE_SIGN_IDENTITY[sdk=iphoneos*]: "Apple Development: Marcus Ziadé (AUJJ76QHS7)"
          PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]: Tailscode Widget Dev iPhone Air 2026
        Release:
          CODE_SIGN_IDENTITY[sdk=iphoneos*]: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]: Tailscode Widget App Store 2026

  TailscodeNSE:
    type: app-extension
    platform: iOS
    sources:
      - path: TailscodeNSE
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
      - path: Tailscode/Usage/UsageWidgetStore.swift
      - path: Tailscode/Usage/UsagePushPayload.swift
      - path: Tailscode/Logging/AppLogger.swift
      - path: Tailscode/Logging/LogFileWriter.swift
      - path: Tailscode/Notifications/NoticeFace.swift
      - path: Tailscode/Notifications/NoticeContent.swift
      - path: Tailscode/Notifications/NoticeCategories.swift
      - path: Tailscode/Notifications/NoticeBadge.swift
      - path: Tailscode/Notifications/NoticePushDresser.swift
      - path: TailscodeCore/Sources/TailscodeCore/NoticeWire.swift
      - path: TailscodeCore/Sources/TailscodeCore/Localized.swift
    info:
      path: TailscodeNSE/Info.plist
      properties:
        CFBundleDisplayName: Tailscode
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    dependencies:
      - sdk: UserNotifications.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.guitaripod.tailscode.nse
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) NOTICE_EXTENSION"
        MARKETING_VERSION: "1.78"
        CURRENT_PROJECT_VERSION: "199"
        SKIP_INSTALL: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: P4DQK6SRKR
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]: NO
        CODE_SIGN_ENTITLEMENTS: TailscodeNSE/TailscodeNSE.entitlements
      configs:
        Debug:
          CODE_SIGN_IDENTITY[sdk=iphoneos*]: "Apple Development: Marcus Ziadé (AUJJ76QHS7)"
          PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]: Tailscode NSE Dev iPhone Air 2026
        Release:
          CODE_SIGN_IDENTITY[sdk=iphoneos*]: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]: Tailscode NSE App Store 2026

  TailscodeNotificationUI:
    type: app-extension
    platform: iOS
    sources:
      - path: TailscodeNotificationUI
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
      - path: Tailscode/Notifications/NoticeFace.swift
      - path: TailscodeCore/Sources/TailscodeCore/NoticeWire.swift
      - path: TailscodeCore/Sources/TailscodeCore/Localized.swift
    info:
      path: TailscodeNotificationUI/Info.plist
      properties:
        CFBundleDisplayName: Tailscode
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.content-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationViewController
          NSExtensionAttributes:
            UNNotificationExtensionCategory:
              - tailscode.turn
              - tailscode.turn.failed
              - tailscode.approval
              - tailscode.question
              - tailscode.question.slot0
              - tailscode.question.slot1
              - tailscode.question.slot2
              - tailscode.question.slot3
            UNNotificationExtensionInitialContentSizeRatio: 0.7
            UNNotificationExtensionDefaultContentHidden: true
            UNNotificationExtensionUserInteractionEnabled: false
    dependencies:
      - sdk: UserNotifications.framework
      - sdk: UserNotificationsUI.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.guitaripod.tailscode.notificationui
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) NOTICE_EXTENSION"
        MARKETING_VERSION: "1.78"
        CURRENT_PROJECT_VERSION: "199"
        SKIP_INSTALL: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: P4DQK6SRKR
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]: NO
      configs:
        Debug:
          CODE_SIGN_IDENTITY[sdk=iphoneos*]: "Apple Development: Marcus Ziadé (AUJJ76QHS7)"
          PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]: Tailscode Notification UI Dev iPhone Air 2026
        Release:
          CODE_SIGN_IDENTITY[sdk=iphoneos*]: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]: Tailscode Notification UI App Store 2026

  TailscodeMacWidget:
    type: app-extension
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: TailscodeMacWidget
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
      - path: Tailscode/Usage/UsageWidgetStore.swift
      - path: Tailscode/Usage/UsagePushPayload.swift
      - path: Tailscode/Usage/UsageWidgetWriter.swift
      - path: TailscodeWidget/UsageWidgetConfiguration.swift
      - path: TailscodeWidget/UsageWidgetViews.swift
      - path: TailscodeWidget/UsageControlWidget.swift
      - path: Tailscode/Usage/UsageControlIntents.swift
    dependencies:
      - package: CodingAgentKit
        product: CodingAgentKit
      - package: CodingAgentKit
        product: CodingAgentKitApple
      - package: TailscodeCore
        product: TailscodeCore
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework
    info:
      path: TailscodeMacWidget/Info.plist
      properties:
        CFBundleDisplayName: Tailscode
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.guitaripod.tailscode.macwidget
        MARKETING_VERSION: "1.78"
        CURRENT_PROJECT_VERSION: "195"
        SKIP_INSTALL: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO

  TailscodeMac:
    templates: [MacApp]
    dependencies:
      - target: TailscodeMacWidget
    settings:
      base:
        PRODUCT_NAME: TailscodeMac
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO

  TailscodeMacStore:
    templates: [MacApp]
    settings:
      base:
        PRODUCT_NAME: Tailscode
        CURRENT_PROJECT_VERSION: "195"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) TAILSCODE_MAS"
        CODE_SIGN_ENTITLEMENTS: TailscodeMac/TailscodeMac-Store.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        DEVELOPMENT_TEAM: P4DQK6SRKR
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"

schemes:
  Tailscode:
    build:
      targets:
        Tailscode: all
    run:
      config: Debug
      storeKitConfiguration: Tailscode.storekit
    archive:
      config: Release
  TailscodeMac:
    build:
      targets:
        TailscodeMac: all
    run:
      config: Debug
    archive:
      config: Release
  TailscodeMacStore:
    build:
      targets:
        TailscodeMacStore: all
    run:
      config: Debug
    archive:
      config: Release
